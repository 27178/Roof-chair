name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Tester, typkontroll och bygge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Kör enhetstester
        run: npm test

      - name: Typkontroll och produktionsbygge
        run: npm run build
